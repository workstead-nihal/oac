<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="50%" stop-color="#0C0C0C"/>
      <stop offset="100%" stop-color="#1A0505"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3B334"/>
      <stop offset="50%" stop-color="#D91515"/>
      <stop offset="100%" stop-color="#F3B334"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Outer Glow -->
  <circle cx="64" cy="64" r="60" fill="none" stroke="url(#goldBorder)" stroke-width="3" filter="url(#glow)" />
  
  <!-- Dark Emblem Body -->
  <circle cx="64" cy="64" r="56" fill="url(#bgGrad)" stroke="#F3B334" stroke-width="1.5" />
  
  <!-- Inner Crimson Ki Ring -->
  <circle cx="64" cy="64" r="50" fill="none" stroke="#D91515" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.8" />
  
  <!-- OAC Anime Emblem Center Graphic -->
  <!-- Bold Stylized Lettering "OAC" -->
  <text x="64" y="68" text-anchor="middle" font-family="'Outfit', 'Bebas Neue', 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="1">OAC</text>
  
  <!-- Gold Accent Kanji / Katakana for "Anime" -->
  <text x="64" y="86" text-anchor="middle" font-family="'Noto Sans JP', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#F3B334" letter-spacing="2">オディシャ</text>
  
  <!-- Star Pip Top -->
  <polygon points="64,22 66,27 71,27 67,30 69,35 64,32 59,35 61,30 57,27 62,27" fill="#F3B334" />
</svg>
